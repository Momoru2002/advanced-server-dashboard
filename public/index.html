<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advanced Server Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">

<header>
  <h1>Home Server Command Center</h1>
  <p>Real-time Infrastructure Monitoring</p>
</header>

<section class="cards">
  <div class="card"><h3>Hostname</h3><span id="hostname">--</span></div>
  <div class="card"><h3>IP</h3><span id="ip">--</span></div>
  <div class="card"><h3>OS</h3><span id="os">--</span></div>
  <div class="card"><h3>CPU Cores</h3><span id="cores">--</span></div>
</section>

<section class="charts">
  <div class="chart-card">
    <canvas id="pieChart"></canvas>
  </div>

  <div class="chart-card">
    <canvas id="barChart"></canvas>
  </div>
</section>

</div>

<script src="js/dashboard.js"></script>
</body>
</html>
